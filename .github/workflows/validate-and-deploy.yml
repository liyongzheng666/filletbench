name: Verify, reproduce and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filletbench-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python bench.py verify
      - run: python -m unittest discover -s tests
  occt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-occt.txt
      - run: python bench.py run --engine occt --case 8 --radius 18 --out runs/ci-occt
      - name: Reject wrong inputs and verify both variable endpoint orientations
        run: python adapters/occt/test_runner.py
      - name: Replay the original reviewed R6 and capping recipe
        run: |
          python bench.py original --case 22 --variant part01-r6 --out runs/ci-original22
          python bench.py original --case 18 --variant sheet-r8 --out runs/ci-original18
          python - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('runs/ci-original22/native/22.part01-r6/summary.json').read_text())
          assert s['native_call_executed'] is True and s['parameters']['radius_mm']==6, s
          assert s['preprocess']['execution_mode']=='from_base', s
          assert s['source_sha256']=='0c46b9e44c22739e8c2821988bb33a08d45ceab9a5f40b498ef7df47d27bdfe8', s
          # Export failures remain observations; native success is not a source feature pass.
          assert s['special_feature_certified'] is False, s
          PY
      - name: Exercise the requested original case08 R15
        run: |
          python bench.py original --case 8 --variant r15-crossing --out runs/ci-case08-r15
          python - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('runs/ci-case08-r15/native/08.r15-crossing/summary.json').read_text())
          assert s['native_call_executed'] is True and s['parameters']['radius_mm']==15, s
          assert s['source_sha256']=='57ea045f7da3735141b7f21f2fbc3e3a51c39933d08a5d7c6e3374e01ab064f9', s
          PY
      - name: Confirm a real native call, not a placeholder
        run: |
          python - <<'PY'
          import json,pathlib
          s=json.loads(next(pathlib.Path('runs/ci-occt').rglob('summary.json')).read_text())
          assert s['native_call_executed'] is True, s
          assert s['source_sha256'], s
          PY
      - name: Rebuild the convex case11 input and audit physical material sides
        run: |
          python bench.py original --case 11 --out runs/ci-case11
          python adapters/occt/case11-convexity/audit_material.py --source runs/ci-case11/case11-convexity/before.brep --step runs/ci-case11/case11-convexity/before.step --output runs/ci-case11-material
          python - <<'PY'
          import json,pathlib
          a=json.loads(pathlib.Path('runs/ci-case11-material/new-geometry-audit.json').read_text())
          assert a['automated_gates_passed'] and all(a['gates'].values()), a['gates']
          assert a['target_A']['exact_interior_material_angle_deg']==90
          assert a['human_appearance_status']=='pending'
          PY
  smlib:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned open-source kernel
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NVIDIA-Omniverse/usd-brep.git .cache/usd-brep
          git -C .cache/usd-brep checkout c9c5979f04cea8c38213004d4f04df0dcfb40d05
      - name: Build kernel from upstream sources
        run: |
          cmake -S adapters/smlib/core -B .cache/smlib-core -DSMLIB_ROOT="$PWD/.cache/usd-brep" -DCMAKE_BUILD_TYPE=Release
          cmake --build .cache/smlib-core --parallel 4
      - name: Run exact fixture import and native fillet
        env:
          SMLIB_ROOT: ${{ github.workspace }}/.cache/usd-brep
          SMLIB_LIBRARY: ${{ github.workspace }}/.cache/smlib-core/libsmlib_filletbench.so
        run: python bench.py run --engine smlib --case 8 --radius 18 --out runs/ci-smlib
      - name: Replay a native G2 request (quality acceptance remains separate)
        env:
          SMLIB_ROOT: ${{ github.workspace }}/.cache/usd-brep
          SMLIB_LIBRARY: ${{ github.workspace }}/.cache/smlib-core/libsmlib_filletbench.so
        run: python bench.py special --engine smlib --job 35/pilot-smlib-thumb10 --out runs/ci-smlib-g2
      - name: Confirm the special result came from this fresh invocation
        run: |
          python - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('runs/ci-smlib-g2/summary.json').read_text())
          assert s['freshly_executed'] is True, s
          assert s['execution']['native_api_raw_status'] == 1000, s
          assert s['source_feature_passed'] is False, s
          PY
      - name: Replay an audited original-view SMLib radius completion
        env:
          SMLIB_ROOT: ${{ github.workspace }}/.cache/usd-brep
          SMLIB_LIBRARY: ${{ github.workspace }}/.cache/smlib-core/libsmlib_filletbench.so
        run: |
          python adapters/smlib/run.py data/original-smlib/jobs/original.01.part01-r12.smlib.json --output runs/ci-original-smlib-r12 || true
          python - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('runs/ci-original-smlib-r12/summary.json').read_text())
          assert s['input_import']['passed'] is True, s
          assert s['execution']['native_call_started'] is True, s
          assert s['execution']['radius_mm'] == 12, s
          assert s['source_sha256'] == '004668eef19715982beb4f435dbbedcef5fe02815331f94980e9861142392ea1', s
          PY
      - name: Exercise the same-source case08 R15 SMLib request
        env:
          SMLIB_ROOT: ${{ github.workspace }}/.cache/usd-brep
          SMLIB_LIBRARY: ${{ github.workspace }}/.cache/smlib-core/libsmlib_filletbench.so
        run: |
          python adapters/smlib/run.py data/case08-radius/smlib-jobs/case08.original.r15.smlib.json --output runs/ci-case08-smlib-r15 || true
          python - <<'PY'
          import json,pathlib
          s=json.loads(pathlib.Path('runs/ci-case08-smlib-r15/summary.json').read_text())
          assert s['input_import']['passed'] is True and s['execution']['native_call_started'] is True, s
          assert s['execution']['radius_mm']==15, s
          PY
      - name: Replay all three convex case11 SMLib requests
        env:
          SMLIB_ROOT: ${{ github.workspace }}/.cache/usd-brep
          SMLIB_LIBRARY: ${{ github.workspace }}/.cache/smlib-core/libsmlib_filletbench.so
        run: |
          for radius in 1 3 6; do
            python adapters/smlib/run.py data/case11-convexity/smlib-candidate-v6-r${radius}.job.json --output runs/ci-case11-smlib-r${radius} || true
          done
          python - <<'PY'
          import json,pathlib
          for r in (1,3,6):
              s=json.loads(pathlib.Path(f'runs/ci-case11-smlib-r{r}/summary.json').read_text())
              assert s['input_import']['passed'] and s['selection_passed'], s
              assert s['execution']['native_call_started'] and s['radius_mm']==r, s
              assert s['source_sha256']=='db6c6a783a9e19b1a705a6be8677db296592a0d4a72471a2044261e369b51301', s
          PY
      - name: Confirm an admitted input and actual native call
        run: |
          python - <<'PY'
          import json,pathlib
          s=json.loads(next(pathlib.Path('runs/ci-smlib').rglob('summary.json')).read_text())
          assert s['input_import']['passed'] is True, s
          assert s['execution']['native_call_started'] is True, s
          PY
  pages:
    if: github.event_name != 'pull_request'
    needs: [validate, occt, smlib]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - name: Publish viewer
        id: deployment
        uses: actions/deploy-pages@v4
